<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Default Prediction</title>
</head>
<body style="background-color: darkgoldenrod;">
    <center>
        <h1>Enter User Information</h1>
        <form action="/predict" method="post">
            <label for="employed">Employed (1 for Yes, 0 for No):</label>
            <input type="number" id="employed" name="employed" required><br><br>

            <label for="balance">Bank Balance:</label>
            <input type="number" id="balance" name="balance" step="0.01" required><br><br>

            <label for="salary">Annual Salary:</label>
            <input type="number" id="salary" name="salary" step="0.01" required><br><br>

            <input type="submit" value="Predict">
        </form>
    </center>
</body>
</html>
